<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Vista Studio{% endblock %}</title>
  <style>
    :root { --fundo: #15171c; --painel: #23262e; --borda: #3a3f4b; --texto: #eef0f5; --suave: #9aa1b1; --primaria: #9575cd; }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --fundo: #eef0f4; --painel: #fff; --borda: #d6d9e0; --texto: #1d1f27; --suave: #5e6575; --primaria: #5e35b1; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, Roboto, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
    h1 { color: var(--primaria); margin: 0 0 4px; font-size: 32px; }
    .cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 20px; }
    .cartao { display: block; background: var(--painel); border: 1px solid var(--borda); border-radius: 14px; padding: 18px; color: inherit; text-decoration: none; }
    .cartao:hover { border-color: var(--primaria); }
    .cartao h2 { margin: 0 0 6px; font-size: 20px; }
    .cartao.sugerido { border: 2px solid var(--primaria); }
    .nota { color: var(--suave); font-size: 14px; }
    ul { padding-left: 20px; }
    code { background: var(--painel); padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body><main>{% block conteudo %}{% endblock %}</main></body>
</html>
