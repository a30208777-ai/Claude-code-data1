{% extends "base.html" %}
{% block titulo %}Perfil · Rolox{% endblock %}
{% block conteudo %}
<h1>{{ perfil.username }}</h1>
<h2>⚙️ Configurações (config)</h2>
<form method="post" class="pilha">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Idioma do chat
    <select name="idioma">
      {% for k, v in idiomas.items() %}<option value="{{ k }}" {{ 'selected' if perfil.idioma == k }}>{{ v }}</option>{% endfor %}
    </select>
  </label>
  <label>Jogo onde uso hack/mod
    <select name="jogo_mod">
      <option value="">Nenhum (jogo limpo)</option>
      {% for gid, nome in jogos.items() %}<option value="{{ gid }}" {{ 'selected' if perfil.jogo_mod == gid }}>{{ nome }}</option>{% endfor %}
    </select>
  </label>
  <p class="nota">Com hack/mod marcado, você só entra nos servidores de hack desse jogo. Pode trocar a qualquer momento.</p>
  <label class="chave"><input type="checkbox" name="localizacao" {{ 'checked' if perfil.aceitou_localizacao }}> Mostrar onde estou para amigos</label>
  <button class="btn">Salvar</button>
</form>
<hr style="border:0;border-top:1px solid var(--borda);margin:24px 0">
<form method="post" action="{{ url_for('sair_da_conta') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <button class="btn contorno">Sair da conta</button>
</form>
{% endblock %}
