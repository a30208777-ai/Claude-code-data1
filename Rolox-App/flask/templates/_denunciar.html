{# formulário de denúncia. Precisa: tipo, alvo, voltar #}
<details class="denunciar">
  <summary>🚩 Denunciar</summary>
  <form method="post" action="{{ url_for('denunciar') }}" class="pilha">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="tipo" value="{{ tipo }}"><input type="hidden" name="alvo" value="{{ alvo }}">
    <input type="hidden" name="voltar" value="{{ voltar }}">
    <label>Motivo
      <select name="motivo" required>
        {% for k, v in motivos_denuncia.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}
      </select>
    </label>
    <label>O que aconteceu? (opcional)
      <input type="text" name="detalhe" maxlength="300" placeholder="Ex.: me xingou no chat do jogo Obby">
    </label>
    <button class="btn pequeno">Enviar denúncia</button>
  </form>
</details>
