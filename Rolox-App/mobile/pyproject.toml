[project]
name = "rolox-mobile"
version = "0.26.0"
description = "App Rolox para celular (Android/iOS) em Python + Flet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet==1.1.2",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.flet]
org = "com.rolox"
product = "Rolox"
company = "Rolox"
copyright = "Rolox"

# ícone (src/assets/icon.png) e tela de abertura (src/assets/splash.png): ferramentas/gerar_logo.py
[tool.flet.splash]
color = "#26105c"
dark_color = "#140a33"

[tool.flet.android]
adaptive_icon_background = "#26105c"

# rolox://abrir  -> abre o ROLOX (usado pelo Atualizador do ROLOX e pelo atalho que ele cria)
[tool.flet.android.deep_linking]
scheme = "rolox"

# o ROLOX precisa "enxergar" o Atualizador (Android 11+ esconde os outros apps): ver rolox/protecao.py
[[tool.flet.android.queries.intent]]
action = "android.intent.action.VIEW"
data = { scheme = "roloxatualizador" }

[tool.flet.app]
path = "src"
module = "main"

# o app precisa de internet para falar com o Supabase
[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
