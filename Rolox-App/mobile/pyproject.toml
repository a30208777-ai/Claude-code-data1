[project]
name = "rolox-mobile"
version = "0.21.0"
description = "App Rolox para celular (Android/iOS) em Python + Flet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flet==1.1.2",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.flet]
org = "com.rolox"
product = "Rolox"
company = "Rolox"
copyright = "Rolox"

# ícone (src/assets/icon.png) e tela de abertura (src/assets/splash.png): ferramentas/gerar_logo.py
[tool.flet.splash]
color = "#26105c"
dark_color = "#140a33"

[tool.flet.android]
adaptive_icon_background = "#26105c"

[tool.flet.app]
path = "src"
module = "main"

# o app precisa de internet para falar com o Supabase
[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
