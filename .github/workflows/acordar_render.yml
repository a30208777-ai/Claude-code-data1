# ⏰ Mantém o ROLOX no Render acordado: abre /api/notdesligar a cada 5 minutos.
# (O GitHub pode atrasar alguns minutos em horários cheios.)
name: Acordar Render

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cutucar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Abrir /api/notdesligar
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 90 https://rolox-gj2i.onrender.com/api/notdesligar
