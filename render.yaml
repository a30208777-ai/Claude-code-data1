services:
  - type: web
    name: discord-bot-painel
    runtime: python
    plan: free
    region: oregon
    rootDir: discord-bot-painel
    branch: ccr-2b660cd9-dhk43n
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
